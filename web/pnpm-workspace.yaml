# Postinstall scripts are opt-in, not opt-out. None of these four are needed:
# `sharp` and `@parcel/watcher` ship prebuilt binaries for this platform, and
# `@swc/core` and `unrs-resolver` are transitive build-tool dependencies whose
# native steps nothing here exercises. Declared explicitly so the list is a
# decision rather than a warning nobody read.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  sharp: false
  unrs-resolver: false

# Security advisories in packages this project never chose. All five arrive
# transitively -- through next, next-intl, tailwind, vitest and the eslint
# toolchain -- and all five have a published patch, so they are fixed here rather
# than muted in CI.
#
# The selectors are range-scoped on purpose. `brace-expansion` is why: the tree
# carries 1.1.16, 2.1.2 and 5.0.8 and only the first is affected, so a bare
# "^1.1.17" would drag the 2.x and 5.x consumers down a major to fix a package
# that was never vulnerable.
#
# `pnpm.overrides` in package.json is NOT read by pnpm 11 -- it warns and ignores
# the key. This file is where they live now.
overrides:
  'nanoid@<3.3.18': '^3.3.18'
  'postcss@<8.5.12': '^8.5.12'
  'sharp@<0.35.0': '^0.35.0'
  'js-yaml@>=4.0.0 <4.3.1': '^4.3.1'
  # Three separate majors are in the tree and each has its own advisory and its own
  # patch. One entry per major, so a consumer pinned to 2.x is fixed inside 2.x.
  'brace-expansion@<1.1.17': '^1.1.17'
  'brace-expansion@>=2.0.0 <2.1.4': '^2.1.4'
  'brace-expansion@>=4.0.0 <5.0.9': '^5.0.9'
