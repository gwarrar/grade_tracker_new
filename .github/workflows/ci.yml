name: CI

# Pushes to any branch and every pull request. A gate that only runs on main
# tells you a branch was broken after it was merged, which is the one moment it
# is least useful.
on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes the run in flight. Without this, a branch pushed three
# times queues three full runs and the first two are already irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # 3.12 rather than the latest: it is the floor pyproject declares, and
      # testing on the newest interpreter would let a 3.13-only construct through
      # while claiming 3.12 support.
      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run pyright

      # The coverage floor lives in pyproject, so it fails here without being
      # restated — one number, one place.
      - name: Test
        run: uv run pytest --cov

      # A known CVE in a pinned dependency is a build failure, not a surprise
      # found later. `uv.lock` is the input, so this checks what actually ships.
      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit --strict

      # The committed spec is what generates the frontend's types. If it drifts,
      # the types describe an API that no longer exists and every call still
      # compiles.
      - name: OpenAPI spec is current
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code ../docs/openapi.json \
            || { echo "::error::docs/openapi.json is stale — run scripts/export_openapi.py and commit"; exit 1; }

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. It is pinned by `packageManager` in
      # web/package.json, and action-setup reads that. Two sources drifted apart
      # once already -- node_modules built by pnpm 11 against a pnpm 10 on PATH,
      # after which every `pnpm add` refused to run -- and specifying both here
      # makes action-setup fail outright when they disagree.
      # `package_json_file` because there is no package.json at the repository
      # root: `defaults.run.working-directory` applies to `run:` steps only, not
      # to an action, so this step would otherwise look in the wrong place.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm eslint .

      - name: Test
        run: pnpm vitest run --coverage

      # Blocking: what actually reaches a browser. A high-severity advisory in
      # something this application serves is worth stopping a release for.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Reporting only, deliberately. The first version of this gate audited the
      # whole tree and blocked, which meant an advisory inside eslint's transitive
      # dependencies failed a build where nobody had touched shipping code -- and
      # it did, on its very first run. Worth seeing; not worth failing on.
      - name: Audit the full dependency tree
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # The generated client must match the committed spec. Regenerating and
      # diffing catches the case where the spec moved and nobody re-ran gen:api.
      - name: Generated API types are current
        run: |
          pnpm gen:api
          git diff --exit-code lib/api-schema.d.ts \
            || { echo "::error::lib/api-schema.d.ts is stale — run pnpm gen:api and commit"; exit 1; }

      - name: Build
        run: pnpm build
