[project]
name = "grade-tracker"
version = "2.0.0"
description = "Student grade management: domain core, REST API, and a provider-agnostic AI agent."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "gwarrar", email = "ghyath147@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "notenverwaltung"

# ── Lint ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",      # pycodestyle, pyflakes
    "I",           # import sorting
    "N",           # pep8-naming
    "D",           # pydocstyle — docstrings are mandatory
    "UP",          # pyupgrade
    "ANN",         # annotations are mandatory
    "B",           # bugbear
    "S",           # bandit (security)
    "C4",          # comprehensions
    "SIM",         # simplify
    "RUF",
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # Any is occasionally correct (JSON payloads)
]

[tool.ruff.lint.per-file-ignores]
# Asserts and terse docstrings are normal in tests, and fixtures legitimately
# contain fake credentials -- S105-S107 only produce noise there.
"tests/**" = ["D", "S101", "S105", "S106", "S107", "ANN"]
"scripts/**" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ── Types ────────────────────────────────────────────────────────────────────
[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false      # third-party libs without full stubs
reportUnknownVariableType = false
reportUnknownArgumentType = false

# ── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/notenverwaltung", "src/services"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
